services:
  # docker compose up --build --no-log-prefix -d

  snip:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
    - 3500:8080

    environment:
      NOVA_LOG_LEVEL: INFO
      #NOVA_LOG_LEVEL: DEBUG
      STORE_PATH: ./store
      DATA_PATH: ./data

      HTTP_PORT: 8080

      CODER_DIRECTIVES_PATH_FILE: ./directives/coder.agent.system.instructions.md
      #CODER_DIRECTIVES_PATH_FILE: ./directives/thinker.agent.system.instructions.md
      #CODER_DIRECTIVES_PATH_FILE: ./directives/expert.agent.system.instructions.md
      CODER_TEMPERATURE: 0.8
      CODER_TOP_P: 0.9

      CONTEXT_SIZE_LIMIT: 32000
      SIMILARITY_LIMIT: 0.4
      MAX_SIMILARITIES: 7

      STORE_FILE: golang.snippets.store.json

    volumes:
      - ./data:/app/data:rw
      - ./directives:/app/directives:rw
      - ./store:/app/store:rw

    models:
      rag-model:
        endpoint_var: ENGINE_URL
        model_var: RAG_EMBEDDING_MODEL_ID

      metadata-model:
        endpoint_var: ENGINE_URL
        model_var: METADATA_MODEL_ID

      compressor-model:
        endpoint_var: ENGINE_URL
        model_var: COMPRESSOR_MODEL_ID

      coder-model:
        endpoint_var: ENGINE_URL
        model_var: CODER_MODEL_ID


models:

  rag-model:
    model: ai/embeddinggemma:latest

  metadata-model:
    model: hf.co/menlo/jan-nano-gguf:q4_k_m

  compressor-model:
    model: hf.co/menlo/jan-nano-128k-gguf:q4_k_m
    #model: ai/qwen2.5:3B-F16
    context_size: 32768

  coder-model:
    #model: hf.co/quantfactory/deepseek-coder-7b-instruct-v1.5-gguf:q4_k_m
    #model: hf.co/menlo/lucy-128k-gguf:q4_k_m
    #model: hf.co/menlo/jan-nano-128k-gguf:q4_k_m
    model: hf.co/qwen/qwen2.5-coder-3b-instruct-gguf:q4_k_m
    context_size: 32768

